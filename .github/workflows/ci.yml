name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax (install.sh + agentos CLI)
        run: |
          bash -n install.sh
          bash -n agentos

      - name: cloud-init sanity (pure ASCII + valid YAML)
        # cloud-init's YAML 1.1 parser rejects non-ASCII bytes and then
        # silently skips runcmd — the deploy button "works" but installs
        # nothing. Keep this file 7-bit ASCII forever.
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import sys, yaml
          data = open('cloud-init.yaml','rb').read()
          bad = [i for i, b in enumerate(data) if b > 127]
          if bad:
              print(f"cloud-init.yaml: non-ASCII byte at offset {bad[0]}")
              sys.exit(1)
          yaml.safe_load(data)
          print('cloud-init.yaml ok')
          PY

      - name: Agent-install prompt cannot drift from install.sh
        # agent-install.md is the second install channel: a prompt that makes a
        # coding agent CALL install.sh. It is only safe while it stays a shell
        # around the installer — one flag it invents, one URL it fetches on its
        # own, one pinned version, and it becomes a second source of truth about
        # how AgentOS is installed. The script checks exactly that.
        run: python3 .github/check-agent-prompt.py

  english:
    # try-agent-os/agentos is public. Branch names, commit subjects and bodies,
    # PR title and body, code, comments and docs are read by people who do not
    # speak Russian, and they are read forever. That rule used to live only in
    # the prompt of whoever wrote the change, and on 2026-09-20 it cost a
    # rewrite of public main's history plus three PR bodies. This job is the
    # mechanical version: not "should be English", but "cannot be merged
    # otherwise". Separate from `lint` on purpose -- it guards the change, not
    # the tree, and its findings should not be mixed with a shell syntax error.
    name: English only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate reads every commit in the pull request and the diff
          # against the base, so it needs the history behind both SHAs. With
          # the default shallow fetch it would fail loudly rather than scan a
          # truncated range -- which is correct, and useless as a gate.
          fetch-depth: 0

      - name: Self-test of the gate
        # A gate nobody tests is a green check that means nothing. This run
        # proves every surface still fails on Cyrillic before the real scan
        # is believed: commit subject and body, branch, PR title and body,
        # added lines, added paths, pushes to main, and both bypasses.
        run: python3 .github/test-check-english.py

      - name: No Cyrillic in branch, commits, PR text or added lines
        run: python3 .github/check-english.py
